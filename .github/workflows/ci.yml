name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.lock

      - run: pip install -e ".[dev,api]" mypy import-linter

      - name: Ruff
        run: ruff check src tests

      - name: Import-linter
        run: lint-imports

      - name: Mypy
        run: mypy src/fraud_service --strict

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.lock

      - run: pip install -e ".[dev,api]"

      - name: Fast suite
        run: pytest -m "not slow" --cov-fail-under=80

      - name: Behavioural gate
        run: pytest -m "behavioural" -q --no-cov

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: .coverage

  image-smoke:
    needs: [lint, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image with cache
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: fraud-service:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start service
        run: docker compose up -d

      - name: Smoke test
        run: make smoke

      - name: Stop service
        if: always()
        run: docker compose down
